name: Publish documentation

on:
  push:
    paths:
      - docs/**
      - config_repo/requirements-dev.txt
      - version.json
      - .github/workflows/docs_pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allsky-documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.branch.outputs.publish }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: stable
          persist-credentials: false

      - name: Select the published branches
        id: branch
        env:
          PUSHED_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          next=$(python3 -c 'import json; print(json.load(open("stable/version.json"))["next"])')
          git check-ref-format --branch "$next" >/dev/null
          if [[ "$next" == "$DEFAULT_BRANCH" ]]; then
            echo "version.json next must name a branch other than $DEFAULT_BRANCH" >&2
            exit 1
          fi
          if [[ "$PUSHED_BRANCH" == "$DEFAULT_BRANCH" || "$PUSHED_BRANCH" == "$next" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo "next=$next" >> "$GITHUB_OUTPUT"
            if [[ "$PUSHED_BRANCH" == "$next" ]]; then
              echo 'build_next=true' >> "$GITHUB_OUTPUT"
            else
              echo 'build_next=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Skipping documentation push on $PUSHED_BRANCH"
          fi

      - name: Check out next branch
        if: steps.branch.outputs.build_next == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.branch.outputs.next }}
          path: next
          persist-credentials: false

      - name: Configure GitHub Pages
        if: steps.branch.outputs.publish == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        if: steps.branch.outputs.publish == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stable/config_repo/requirements-dev.txt

      - name: Install documentation dependencies
        if: steps.branch.outputs.publish == 'true'
        run: python -m pip install -r stable/config_repo/requirements-dev.txt

      - name: Install next branch documentation dependencies
        if: steps.branch.outputs.build_next == 'true'
        run: python -m pip install -r next/config_repo/requirements-dev.txt

      - name: Build default branch documentation
        if: steps.branch.outputs.publish == 'true'
        env:
          ALLSKY_DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          ALLSKY_DOCS_ASSET_PATH: ${{ steps.pages.outputs.base_path }}/assets
        run: bash stable/docs/allsky_docs.sh build "$GITHUB_WORKSPACE/site" "$ALLSKY_DOCS_ASSET_PATH"

      - name: Build next documentation
        if: steps.branch.outputs.build_next == 'true'
        env:
          ALLSKY_DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}/next/
          ALLSKY_DOCS_ASSET_PATH: ${{ steps.pages.outputs.base_path }}/next/assets
        run: bash next/docs/allsky_docs.sh build "$GITHUB_WORKSPACE/site/next" "$ALLSKY_DOCS_ASSET_PATH"

      - name: Show next release placeholder
        if: steps.branch.outputs.publish == 'true' && steps.branch.outputs.build_next != 'true'
        run: |
          mkdir -p site/next
          cp stable/docs/next_release_pending.html site/next/index.html

      - name: Disable Jekyll processing
        if: steps.branch.outputs.publish == 'true'
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        if: steps.branch.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
