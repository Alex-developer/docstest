<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Next release documentation · Allsky</title>
  <meta name="description" content="Documentation for the next Allsky release is coming soon.">
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #edf4ff;
      background:
        radial-gradient(circle at 18% 20%, #a8c5ff 0 1px, transparent 2px),
        radial-gradient(circle at 72% 16%, #d7e5ff 0 1px, transparent 2px),
        radial-gradient(circle at 84% 72%, #b7cfff 0 1px, transparent 2px),
        radial-gradient(circle at 30% 78%, #d7e5ff 0 1px, transparent 2px),
        radial-gradient(ellipse at 50% 100%, #173b65, transparent 55%),
        #071322;
    }
    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 6vw, 4rem);
      border: 1px solid #537395;
      border-radius: 1.5rem;
      background: #0d2237ed;
      box-shadow: 0 1.5rem 5rem #02091480;
      text-align: center;
    }
    .brand { margin: 0 0 3rem; color: #a8cced; font-size: 1.1rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .eyebrow { margin: 0 0 1rem; color: #93caff; font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 3.8rem); line-height: 1.12; letter-spacing: -.04em; }
    p { margin: 1.5rem auto 0; max-width: 31rem; color: #c4d2e1; font-size: 1.05rem; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 2rem;
      padding: .85rem 1.4rem;
      border-radius: .6rem;
      background: #a9d5ff;
      color: #071a2d;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover, a:focus-visible { background: #d5ebff; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Allsky</div>
    <div class="eyebrow">Next release</div>
    <h1>Documentation will be available soon.</h1>
    <p>We’re preparing the guide for the next Allsky release. You can read the current documentation while we get everything ready.</p>
    <a href="/allsky/">Read current documentation</a>
  </main>
</body>
</html>
